name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        # No Supabase env vars needed: SUPABASE_URL/SUPABASE_ANON_KEY are
        # plain server vars read live at container runtime, not baked in at
        # build time (see src/lib/env.ts) — this build never calls out to
        # Supabase either way.
        run: npm run build

      - name: Docker build check
        # PR-only: proves the Dockerfile itself still builds before merge.
        # Skipped on push-to-main so a merge doesn't rebuild the image here
        # *and* again in image.yml — image.yml is the one that actually
        # pushes, gated on this job passing (see its workflow_run trigger).
        if: github.event_name == 'pull_request'
        run: docker build -t atlas:ci-check .
