name: Build and push image

# Runs after CI (ci.yml) finishes on main, not on push directly — this is
# what makes "pushed to GHCR" actually mean "typecheck/lint/tests/build all
# passed", instead of just re-running those checks a second time here (which
# would double CI cost for the same signal — the thing we just removed from
# the Docker build-check step above). Only proceeds if that run succeeded.
#
# Still CI (producing a validated artifact), not CD: nothing here deploys
# anything. ArgoCD is CD — see AGENTS.md / BACKLOG.md Part 2 Priority 4 for
# the tag-promotion step that will eventually follow this workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact commit CI validated, not whatever HEAD of main
          # happens to be when this workflow_run fires.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA tag
        # Use the workflow_run event's head_sha, not $GITHUB_SHA — in a
        # workflow_run context that env var points at this workflow file's
        # own commit, not the commit CI actually validated.
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "TAG=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        # GHCR requires a lowercase repo path; github.repository preserves
        # whatever case the repo was created with.
        id: image
        run: echo "NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.NAME }}:${{ steps.version.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
